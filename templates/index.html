<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GapMusic Pro Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <style>
    :root {
      --bg: #090b10;
      --surface: rgba(24, 28, 38, 0.72);
      --surface-active: rgba(34, 41, 56, 0.92);
      --primary: #1ed760;
      --primary-dark: #159c44;
      --accent: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      font-family: 'Vazirmatn', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0 0 110px 0;
      background: radial-gradient(circle at top right, #161d2f 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header & Search */
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(9, 11, 16, 0.85);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 4px 15px rgba(30, 215, 96, 0.3);
    }

    .brand-text h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .brand-text span {
      font-size: 11px;
      color: var(--muted);
    }

    .shuffle-pill {
      background: linear-gradient(135deg, rgba(30, 215, 96, 0.16), rgba(99, 102, 241, 0.16));
      border: 1px solid rgba(30, 215, 96, 0.35);
      color: var(--primary);
      padding: 7px 14px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s;
    }

    .shuffle-pill:active { transform: scale(0.95); }

    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 40px 11px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      outline: none;
      transition: 0.2s;
    }

    .search-box:focus {
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.09);
      box-shadow: 0 0 0 3px rgba(30, 215, 96, 0.12);
    }

    .search-icon {
      position: absolute;
      right: 13px;
      color: var(--muted);
      font-size: 15px;
      pointer-events: none;
    }

    /* Filter Chips */
    .chips {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      padding: 7px 15px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
    }

    .chip.active {
      background: var(--primary);
      color: #050806;
      border-color: var(--primary);
      font-weight: 800;
    }

    /* Song List */
    .song-list {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .song-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .song-card.playing {
      background: linear-gradient(90deg, rgba(30, 215, 96, 0.14), rgba(24, 28, 38, 0.9));
      border-color: rgba(30, 215, 96, 0.5);
    }

    .cover-thumb {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: rgba(255,255,255,0.9);
      cursor: pointer;
    }

    .cover-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
    }

    .song-info {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .song-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-card.playing .song-title { color: var(--primary); }

    .song-artist {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: 0.15s;
    }

    .icon-btn:active { transform: scale(0.9); }

    .icon-btn.play-btn {
      background: var(--primary);
      color: #000;
      border: none;
      font-weight: bold;
    }

    .load-more-btn {
      margin: 8px auto 16px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 24px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: block;
      width: 100%;
    }

    /* Mini Floating Player */
    .mini-player {
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      z-index: 40;
      background: rgba(20, 25, 36, 0.94);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 20px;
      padding: 10px 14px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65);
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .mini-player.visible { display: flex; }

    .mp-main {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mp-cover {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
    }

    .mp-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
    }

    .mp-meta {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .mp-title {
      font-size: 13.5px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mp-artist {
      font-size: 11.5px;
      color: var(--primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mp-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
    }

    .ctrl-btn.main {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 4px 14px rgba(30, 215, 96, 0.4);
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10.5px;
      color: var(--muted);
      direction: ltr;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--primary);
      height: 4px;
      cursor: pointer;
    }

    .status-banner {
      font-size: 11px;
      color: #fbbf24;
      text-align: center;
      display: none;
    }

    .empty-msg {
      text-align: center;
      color: var(--muted);
      padding: 45px 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div class="top-bar">
      <div class="brand">
        <div class="brand-logo">🎧</div>
        <div class="brand-text">
          <h1>GapMusic</h1>
          <span id="totalCounter">در حال اتصال به آرشیو...</span>
        </div>
      </div>
      <button class="shuffle-pill" onclick="playRandom()">🎲 پخش شانسی</button>
    </div>

    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-box" placeholder="جستجو بین هزاران آهنگ و خواننده..." oninput="onSearch()" />
    </div>

    <div class="chips">
      <div class="chip active" id="chipAll" onclick="setFilter('all')">🎵 همه موزیک‌ها</div>
      <div class="chip" id="chipPopular" onclick="setFilter('popular')">🔥 پرطرفدارترین‌ها</div>
      <div class="chip" id="chipFav" onclick="setFilter('fav')">❤️ پلی‌لیست من</div>
    </div>
  </header>

  <div id="songList" class="song-list">
    <div class="empty-msg">در حال بارگذاری موزیک‌ها...</div>
  </div>
  <button id="loadMoreBtn" class="load-more-btn" style="display:none;" onclick="loadMore()">⬇️ نمایش موزیک‌های بیشتر</button>

  <!-- Floating Glass Player -->
  <div id="miniPlayer" class="mini-player">
    <div class="status-banner" id="playerStatus"></div>
    <div class="mp-main">
      <div class="mp-cover" id="mpCoverBox">🎵</div>
      <div class="mp-meta">
        <div class="mp-title" id="pTitle">انتخاب موزیک</div>
        <div class="mp-artist" id="pArtist">GapMusic</div>
      </div>
      <div class="mp-controls">
        <button class="ctrl-btn" onclick="playPrev()" title="قبلی">⏮</button>
        <button class="ctrl-btn main" id="playPauseBtn" onclick="togglePlay()">▶</button>
        <button class="ctrl-btn" onclick="playNext()" title="بعدی">⏭</button>
      </div>
    </div>
    <div class="progress-row">
      <span id="curTime">0:00</span>
      <input type="range" id="seekBar" value="0" min="0" max="100" oninput="seekAudio()" />
      <span id="durTime">0:00</span>
    </div>
  </div>

  <audio id="audioPlayer" playsinline preload="auto"></audio>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor?.('#090b10');
      tg.setBackgroundColor?.('#090b10');
    }

    const initData = tg?.initData || '';
    const userId = tg?.initDataUnsafe?.user?.id || '';

    let currentFilter = 'all';
    let currentSongs = [];
    let totalAvailable = 0;
    let currentOffset = 0;
    const PAGE_SIZE = 50;
    let isLoading = false;

    let favoriteIds = new Set();
    let currentSong = null;
    let searchTimer = null;
    const coverCache = new Map();

    const audio = document.getElementById('audioPlayer');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const seekBar = document.getElementById('seekBar');
    const statusBanner = document.getElementById('playerStatus');

    const GRADIENTS = [
      'linear-gradient(135deg, #1db954, #191414)',
      'linear-gradient(135deg, #6366f1, #ec4899)',
      'linear-gradient(135deg, #f59e0b, #ef4444)',
      'linear-gradient(135deg, #06b6d4, #3b82f6)',
      'linear-gradient(135deg, #8b5cf6, #10b981)',
      'linear-gradient(135deg, #f43f5e, #fb923c)'
    ];

    function getGradient(id) {
      return GRADIENTS[Math.abs(id || 0) % GRADIENTS.length];
    }

    async function fetchCover(song, imgContainerId) {
      const key = `${song.performer}_${song.title}`;
      if (coverCache.has(key)) {
        const url = coverCache.get(key);
        if (url) applyCoverToEl(imgContainerId, url);
        return url;
      }
      try {
        const res = await fetch(`/api/cover?title=${encodeURIComponent(song.title)}&artist=${encodeURIComponent(song.performer)}`);
        const data = await res.json();
        coverCache.set(key, data.artwork || null);
        if (data.artwork) applyCoverToEl(imgContainerId, data.artwork);
        return data.artwork;
      } catch (e) {
        return null;
      }
    }

    function applyCoverToEl(elId, url) {
      const el = document.getElementById(elId);
      if (!el || !url) return;
      el.innerHTML = `<img src="${url}" alt="cover" loading="lazy" />`;
    }

    async function loadFavorites() {
      try {
        const res = await fetch(`/api/favorites?init_data=${encodeURIComponent(initData)}&user_id=${userId}`);
        const data = await res.json();
        favoriteIds = new Set(data.favorite_ids || []);
        if (currentFilter === 'fav') {
          currentSongs = data.items || [];
          document.getElementById('loadMoreBtn').style.display = 'none';
          renderSongs();
        }
      } catch (e) {}
    }

    async function fetchSongs(reset = true) {
      if (isLoading) return;
      isLoading = true;

      if (reset) {
        currentOffset = 0;
        currentSongs = [];
        document.getElementById('songList').innerHTML = '<div class="empty-msg">در حال دریافت موزیک‌ها...</div>';
      }

      const q = document.getElementById('searchInput').value.trim();
      try {
        const url = `/api/songs?q=${encodeURIComponent(q)}&filter=${currentFilter}&offset=${currentOffset}&limit=${PAGE_SIZE}`;
        const res = await fetch(url);
        const data = await res.json();

        totalAvailable = data.total || 0;
        document.getElementById('totalCounter').textContent = `${totalAvailable.toLocaleString('fa-IR')} موزیک فعال در آرشیو`;

        currentSongs = reset ? (data.items || []) : [...currentSongs, ...(data.items || [])];
        currentOffset = currentSongs.length;

        const moreBtn = document.getElementById('loadMoreBtn');
        if (data.has_more) {
          moreBtn.style.display = 'block';
          moreBtn.textContent = `⬇️ نمایش بیشتر (${currentSongs.length} از ${totalAvailable})`;
        } else {
          moreBtn.style.display = 'none';
        }

        renderSongs();
      } catch (e) {
        document.getElementById('songList').innerHTML = '<div class="empty-msg">خطا در ارتباط با سرور</div>';
      } finally {
        isLoading = false;
      }
    }

    function loadMore() {
      fetchSongs(false);
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.getElementById('chipAll').classList.toggle('active', filter === 'all');
      document.getElementById('chipPopular').classList.toggle('active', filter === 'popular');
      document.getElementById('chipFav').classList.toggle('active', filter === 'fav');

      if (filter === 'fav') {
        loadFavorites();
      } else {
        fetchSongs(true);
      }
    }

    function onSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        if (currentFilter === 'fav') setFilter('all');
        else fetchSongs(true);
      }, 300);
    }

    function renderSongs() {
      const listEl = document.getElementById('songList');
      if (!currentSongs.length) {
        listEl.innerHTML = '<div class="empty-msg">موزیکی با این مشخصات یافت نشد 🎵</div>';
        return;
      }

      listEl.innerHTML = currentSongs.map((s, idx) => {
        const isCurrent = currentSong && currentSong.uid === s.uid;
        const isPlaying = isCurrent && !audio.paused;
        const isFav = favoriteIds.has(s.id);
        const initial = (s.title && s.title !== 'نامشخص' ? s.title[0] : '🎵');
        const coverId = `cov_${s.uid}`;

        return `
          <div class="song-card ${isCurrent ? 'playing' : ''}">
            <div class="cover-thumb" id="${coverId}" style="background:${getGradient(s.id)}" onclick="playSongByIndex(${idx})">
              ${escapeHtml(initial)}
            </div>
            <div class="song-info" onclick="playSongByIndex(${idx})">
              <div class="song-title">${escapeHtml(s.title)}</div>
              <div class="song-artist">${escapeHtml(s.performer)}</div>
            </div>
            <div class="actions">
              <button class="icon-btn" onclick="toggleFav(${s.id}, this)" title="علاقه‌مندی">${isFav ? '❤️' : '🤍'}</button>
              <button class="icon-btn" onclick="sendToChat('${s.uid}')" title="ارسال به پیوی">📥</button>
              <button class="icon-btn play-btn" onclick="playSongByIndex(${idx})">${isPlaying ? '⏸' : '▶'}</button>
            </div>
          </div>
        `;
      }).join('');

      // دریافت تدریجی کاور برای آیتم‌های قابل مشاهده
      currentSongs.slice(0, 25).forEach(s => fetchCover(s, `cov_${s.uid}`));
    }

    async function playSongByIndex(idx) {
      if (idx < 0 || idx >= currentSongs.length) return;
      const song = currentSongs[idx];

      if (currentSong && currentSong.uid === song.uid) {
        togglePlay();
        return;
      }

      currentSong = song;
      document.getElementById('pTitle').textContent = song.title;
      document.getElementById('pArtist').textContent = song.performer;
      document.getElementById('miniPlayer').classList.add('visible');

      const mpCover = document.getElementById('mpCoverBox');
      mpCover.style.background = getGradient(song.id);
      mpCover.textContent = song.title[0] || '🎵';

      statusBanner.style.display = 'block';
      statusBanner.textContent = '⏳ در حال اتصال و بافر کردن موزیک...';

      const streamUrl = `/api/stream/${encodeURIComponent(song.uid)}`;
      audio.src = streamUrl;
      audio.load();

      try {
        await audio.play();
        statusBanner.style.display = 'none';
      } catch (err) {
        statusBanner.textContent = '⚠️ این ترک استریم مستقیم ندارد؛ روی دکمه 📥 بزنید تا به پیوی ارسال شود.';
      }

      const artUrl = await fetchCover(song, 'mpCoverBox');
      updateMediaSession(song, artUrl);
      renderSongs();
    }

    function togglePlay() {
      if (!audio.src) return;
      if (audio.paused) audio.play().catch(() => {});
      else audio.pause();
    }

    function playNext() {
      if (!currentSongs.length) return;
      const idx = currentSongs.findIndex(s => currentSong && s.uid === currentSong.uid);
      const nextIdx = (idx + 1) % currentSongs.length;
      playSongByIndex(nextIdx);
    }

    function playPrev() {
      if (!currentSongs.length) return;
      const idx = currentSongs.findIndex(s => currentSong && s.uid === currentSong.uid);
      const prevIdx = (idx - 1 + currentSongs.length) % currentSongs.length;
      playSongByIndex(prevIdx);
    }

    async function playRandom() {
      try {
        const res = await fetch('/api/random');
        const song = await res.json();
        if (song.uid) {
          currentSongs = [song, ...currentSongs];
          playSongByIndex(0);
        }
      } catch (e) {}
    }

    async function toggleFav(songId, btn) {
      try {
        const res = await fetch(`/api/favorite/${songId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ init_data: initData, user_id: userId })
        });
        const data = await res.json();
        if (data.liked) favoriteIds.add(songId);
        else favoriteIds.delete(songId);
        btn.textContent = data.liked ? '❤️' : '🤍';
        if (currentFilter === 'fav' && !data.liked) loadFavorites();
      } catch (e) {}
    }

    async function sendToChat(uid) {
      try {
        const res = await fetch(`/api/send/${encodeURIComponent(uid)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ init_data: initData, user_id: userId })
        });
        if (res.ok && tg) tg.showAlert('✅ موزیک به چت شما در ربات ارسال شد!');
      } catch (e) {}
    }

    function updateMediaSession(song, artUrl) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: song.title,
          artist: song.performer,
          album: 'GapMusic',
          artwork: artUrl ? [{ src: artUrl, sizes: '400x400', type: 'image/jpeg' }] : []
        });
        navigator.mediaSession.setActionHandler('play', () => audio.play());
        navigator.mediaSession.setActionHandler('pause', () => audio.pause());
        navigator.mediaSession.setActionHandler('nexttrack', playNext);
        navigator.mediaSession.setActionHandler('previoustrack', playPrev);
      }
    }

    audio.addEventListener('playing', () => {
      statusBanner.style.display = 'none';
      playPauseBtn.textContent = '⏸';
      renderSongs();
    });
    audio.addEventListener('pause', () => {
      playPauseBtn.textContent = '▶';
      renderSongs();
    });
    audio.addEventListener('ended', playNext);

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration || isNaN(audio.duration)) return;
      seekBar.value = (audio.currentTime / audio.duration) * 100;
      document.getElementById('curTime').textContent = formatTime(audio.currentTime);
      document.getElementById('durTime').textContent = formatTime(audio.duration);
    });

    function seekAudio() {
      if (!audio.duration || isNaN(audio.duration)) return;
      audio.currentTime = (seekBar.value / 100) * audio.duration;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    loadFavorites();
    fetchSongs(true);
  </script>
